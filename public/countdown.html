<body>
  <header class="site-header">
    <a class="logo" href="https://mdothree.com">m<span class="dot">.</span>three</a>
    <nav class="tool-nav">
      <a href="/">Unix</a>

      <a href="/cron-parser">Cron</a>
      <a href="https://mdothree.com/pro.html" class="pro-nav-link">★ Pro</a>
    </nav>
  </header>

  <main class="tool-main">
    <div class="tool-header">
      <h1>Countdown Timer</h1>
      <p>Live countdown to any date or event.</p>
    </div>
    <div class="tool-body">
      <div>
        <label class="field-label" for="cdTarget">Target Date &amp; Time</label>
        <input type="datetime-local" id="cdTarget" class="input-field" />
      </div>
      <div>
        <label class="field-label" for="cdLabel">Label (optional)</label>
        <input type="text" id="cdLabel" class="input-field" placeholder="e.g. New Year 2026" />
      </div>
      <div class="action-row">
        <button class="btn-primary" id="startCd">Start Countdown</button>
        <button class="btn-ghost" id="stopCd" hidden>Stop</button>
      </div>
      <div class="output-panel" id="cdPanel" hidden>
        <div id="cdTitle" class="countdown-label"></div>
        <div class="countdown-display">
          <div class="countdown-unit">
            <span class="countdown-number" id="cdDays">0</span>
            <span class="countdown-unit-label">Days</span>
          </div>
          <div class="countdown-unit">
            <span class="countdown-number" id="cdHours">0</span>
            <span class="countdown-unit-label">Hours</span>
          </div>
          <div class="countdown-unit">
            <span class="countdown-number" id="cdMinutes">0</span>
            <span class="countdown-unit-label">Minutes</span>
          </div>
          <div class="countdown-unit">
            <span class="countdown-number" id="cdSeconds">0</span>
            <span class="countdown-unit-label">Seconds</span>
          </div>
        </div>
        <div id="cdStatus" class="countdown-status"></div>
      </div>
    </div>
  </main>

  <script src="js/pages/countdown.js" type="module"></script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }
  </script>
</body>
