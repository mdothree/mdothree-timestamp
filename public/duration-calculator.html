  <main class="tool-main">
    <div class="tool-header">
      <h1>Duration Calculator</h1>
      <p>Calculate the exact duration between two dates, or add/subtract time from a date.</p>
    </div>
    <div class="tool-body">
      <div class="dur-grid">
        <div>
          <label class="field-label">Start</label>
          <input type="datetime-local" id="durStart" class="input-field" />
        </div>
        <div>
          <label class="field-label">End</label>
          <input type="datetime-local" id="durEnd" class="input-field" />
        </div>
      </div>
      <div class="action-row">
        <button class="btn-primary" id="calcDur">Calculate</button>
      </div>
      <div class="output-panel" id="durResult" hidden>
        <div id="durRows"></div>
      </div>
      <div class="section-divider">Add / Subtract time</div>
      <div>
        <label class="field-label">Base Date</label>
        <input type="datetime-local" id="addBase" class="input-field" />
      </div>
      <div class="delta-grid">
        <div><label class="field-label">Years</label><input type="number" id="addYears" class="input-field" value="0" min="0" / inputmode="numeric"></div>
        <div><label class="field-label">Months</label><input type="number" id="addMonths" class="input-field" value="0" min="0" / inputmode="numeric"></div>
        <div><label class="field-label">Days</label><input type="number" id="addDays" class="input-field" value="0" min="0" / inputmode="numeric"></div>
        <div><label class="field-label">Hours</label><input type="number" id="addHours" class="input-field" value="0" min="0" / inputmode="numeric"></div>
        <div><label class="field-label">Minutes</label><input type="number" id="addMinutes" class="input-field" value="0" min="0" / inputmode="numeric"></div>
        <div><label class="field-label">Seconds</label><input type="number" id="addSeconds" class="input-field" value="0" min="0" / inputmode="numeric"></div>
      </div>
      <div class="action-row">
        <button class="btn-primary" id="addBtn">Add</button>
        <button class="btn-ghost" id="subBtn">Subtract</button>
      </div>
      <div class="output-panel" id="addResult" hidden>
        <label class="field-label">Result</label>
        <div id="addResultVal" class="add-result-val"></div>
      </div>
    </div>
  </main>
