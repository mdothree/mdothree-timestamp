      <div class="dur-grid">
        <div>

          <input type="datetime-local" id="durStart" class="input-field" />
        </div>

      </div>

      </div>
      <div class="output-panel" id="durResult" hidden>
        <div id="durRows"></div>
      </div>
      <div class="section-divider">Add / Subtract time</div>
      <div>
        <label class="field-label" for="addBase">Base Date</label>
        <input type="datetime-local" id="addBase" class="input-field" />
      </div>
      <div class="delta-grid">
        <div><label class="field-label" for="addYears">Years</label><input type="number" id="addYears" class="input-field" value="0" min="0" / inputmode="numeric"></div>
        <div><label class="field-label" for="addMonths">Months</label><input type="number" id="addMonths" class="input-field" value="0" min="0" / inputmode="numeric"></div>
        <div><label class="field-label" for="addDays">Days</label><input type="number" id="addDays" class="input-field" value="0" min="0" / inputmode="numeric"></div>
        <div><label class="field-label" for="addHours">Hours</label><input type="number" id="addHours" class="input-field" value="0" min="0" / inputmode="numeric"></div>
        <div><label class="field-label" for="addMinutes">Minutes</label><input type="number" id="addMinutes" class="input-field" value="0" min="0" / inputmode="numeric"></div>
        <div><label class="field-label" for="addSeconds">Seconds</label><input type="number" id="addSeconds" class="input-field" value="0" min="0" / inputmode="numeric"></div>
      </div>
      <div class="action-row">
        <button class="btn-primary" id="addBtn">Add</button>
        <button class="btn-ghost" id="subBtn">Subtract</button>
      </div>
      <div class="output-panel" id="addResult" hidden>
