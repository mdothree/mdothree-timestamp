  <main class="tool-main">
    <div class="tool-header">
      <h1>Unix Timestamp Converter</h1>
      <p>Convert between Unix timestamps and human-readable dates. Current epoch time updates live.</p>
    </div>

    <div class="tool-body">
      <!-- Live timestamp -->
      <div class="live-card">
        <div class="live-label">Current Unix Timestamp</div>
        <div class="live-ts" id="liveTs">—</div>
        <div class="live-date" id="liveDate">—</div>
        <button class="btn-ghost" id="copyLiveTs">Copy</button>
      </div>

      <!-- Unix → Date -->
      <div class="converter-block">
        <div class="converter-title">Unix Timestamp → Date</div>
        <div class="converter-row">
          <input type="number" id="tsInput" class="input-field" placeholder="e.g. 1700000000" / inputmode="numeric">
          <select id="tsUnit" class="input-field" style="width:120px">
            <option value="s">Seconds</option>
            <option value="ms">Milliseconds</option>
          </select>
          <button class="btn-primary" id="tsToDate">Convert</button>
        </div>
        <div class="output-panel" id="tsDateOutput" style="display:none">
          <div id="tsDateRows"></div>
        </div>
      </div>

      <div class="section-divider">or</div>

      <!-- Date → Unix -->
      <div class="converter-block">
        <div class="converter-title">Date / Time → Unix Timestamp</div>
        <div class="converter-row" style="flex-wrap:wrap">
          <input type="datetime-local" id="dateInput" class="input-field" />
          <button class="btn-primary" id="dateToTs">Convert</button>
        </div>
        <div class="output-panel" id="dateOutput" style="display:none">
          <div id="dateRows"></div>
        </div>
      </div>
    </div>
  </main>
