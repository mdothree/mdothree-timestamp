  <main class="tool-main">
    <div class="tool-header">
      <h1>Business Days</h1>
      <p>Count working days between dates or find a date N business days away. <strong>Pro feature.</strong></p>
    </div>
    <div class="tool-body">
      <div class="converter-title">Count business days between dates</div>
      <div class="dur-grid">
        <div>
          <label class="field-label">Start</label>
          <input type="date" id="bdStart" class="input-field" />
        </div>
        <div>
          <label class="field-label">End</label>
          <input type="date" id="bdEnd" class="input-field" />
        </div>
      </div>
      <div class="action-row">
        <button class="btn-primary" id="countBd">Count Days</button>
      </div>
      <div class="output-panel" id="bdCountResult" hidden>
        <div id="bdCount" class="bd-count-value"></div>
        <div class="bd-count-sub">business days (Mon–Fri, excluding weekends)</div>
      </div>
      <div class="section-divider">or</div>
      <div class="converter-title">Find date N business days from a start</div>
      <div class="dur-grid">
        <div>
          <label class="field-label">Start Date</label>
          <input type="date" id="bdAddStart" class="input-field" />
        </div>
        <div>
          <label class="field-label">Business days to add</label>
          <input type="number" id="bdAddCount" class="input-field" value="30" min="1" / inputmode="numeric">
        </div>
      </div>
      <div class="action-row">
        <button class="btn-primary" id="addBdBtn">Find Date</button>
      </div>
      <div class="output-panel" id="bdAddResult" hidden>
        <label class="field-label">Result Date</label>
        <div id="bdAddVal" class="bd-add-val"></div>
      </div>
    </div>
  </main>
